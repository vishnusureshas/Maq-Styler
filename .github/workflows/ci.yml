name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (install + syntax + Docker build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all JS sources
        run: |
          files=$(find . -name '*.js' -not -path './node_modules/*')
          for f in $files; do
            node --check "$f" || exit 1
          done

      - name: Validate backend image builds
        run: docker build -t maq-styler-backend:ci .

  frontend:
    name: Frontend (install + typecheck/build + Docker build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + production build (tsc -b && vite build)
        run: npm run build

      - name: Verify image builds
        run: docker build -t maq-styler-frontend:ci .