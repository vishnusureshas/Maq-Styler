name: Deploy (Production)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push images to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/maq-styler-backend:latest
            ghcr.io/${{ github.repository_owner }}/maq-styler-backend:${{ github.sha }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/maq-styler-frontend:latest
            ghcr.io/${{ github.repository_owner }}/maq-styler-frontend:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE_OWNER: ${{ github.repository_owner }}
      IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          script_timeout: 10m
          envs: GITHUB_TOKEN,IMAGE_OWNER,IMAGE_TAG
          script: |
            set -euo pipefail
            if [ ! -d "$HOME/ecommerce/.git" ]; then
              echo "ERROR: ~/ecommerce is not a git checkout."
              echo "Run deploy/ec2-setup.sh on the server once before using the pipeline."
              exit 1
            fi
            cd "$HOME/ecommerce"
            bash deploy/ec2-deploy.sh

      - name: Post-deploy smoke test (from runner)
        run: |
          curl -fsS --retry 10 --retry-delay 5 --retry-all-errors "http://${{ secrets.SSH_HOST }}:5173/health"
          echo
          curl -fsS "http://${{ secrets.SSH_HOST }}:5173/api/v1/products" | head -c 300
          echo