name: Deploy (Production)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest)'
        required: false
        default: 'latest'

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push images to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/maq-styler-backend:latest
            ghcr.io/${{ github.repository_owner }}/maq-styler-backend:${{ github.sha }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/maq-styler-frontend:latest
            ghcr.io/${{ github.repository_owner }}/maq-styler-frontend:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE_OWNER: ${{ github.repository_owner }}
      IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare and validate SSH key
        run: |
          umask 077
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          ssh-keygen -y -f "$RUNNER_TEMP/deploy_key" > /dev/null
          echo "SSH key is valid"

      - name: Test SSH connectivity
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 \
            -i "$RUNNER_TEMP/deploy_key" \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "hostname && git -C ~/ecommerce rev-parse --abbrev-ref HEAD || echo 'REPO_MISSING'"

      - name: Deploy to EC2
        run: |
          {
            printf 'export GITHUB_TOKEN=%q\n' "$GITHUB_TOKEN"
            printf 'export IMAGE_OWNER=%q\n' "$IMAGE_OWNER"
            printf 'export IMAGE_TAG=%q\n' "$IMAGE_TAG"
            cat deploy/ec2-deploy.sh
          } | ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 \
            -i "$RUNNER_TEMP/deploy_key" \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "set -e; cd \$HOME/ecommerce && git pull --ff-only && bash -s"

      - name: Post-deploy smoke test (from runner)
        run: |
          curl -fsS --retry 10 --retry-delay 5 --retry-all-errors "http://${{ secrets.SSH_HOST }}:5173/health"
          echo
          curl -fsS "http://${{ secrets.SSH_HOST }}:5173/api/v1/products" | head -c 300
          echo